<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Emilia · Mi Fiesta de 3 Años</title>

<!-- WhatsApp / social preview -->
<meta property="og:type" content="website" />
<meta property="og:title" content="Emilia - Mi Fiesta de 3 Anos" />
<meta property="og:description" content="Toca aqui para abrir tu invitacion y ver el video" />
<meta property="og:url" content="https://emilia-micumple.vercel.app/" />
<meta property="og:image" content="https://emilia-micumple.vercel.app/assets/preview-wa.jpg" />
<meta property="og:image:type" content="image/jpeg" />
<meta property="og:image:width" content="1200" />
<meta property="og:image:height" content="630" />
<meta name="twitter:card" content="summary_large_image" />
<meta name="twitter:title" content="Emilia - Mi Fiesta de 3 Anos" />
<meta name="twitter:description" content="Toca aqui para abrir tu invitacion y ver el video" />
<meta name="twitter:image" content="https://emilia-micumple.vercel.app/assets/preview-wa.jpg" />
<meta name="theme-color" content="#f7c6d9" />

<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600;700&family=Great+Vibes&family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet" />

<style>
  :root{
    --bg1:#fbe3ee;
    --bg2:#f7c9dd;
    --rose:#ec6fa6;
    --rose-deep:#d94f8c;
    --gold:#c79a4b;
    --env1:#f5b8cd;
    --env2:#ef9bbb;
    --env-flap:#f3a9c5;
    --cream:#fff7fb;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    font-family:"Cormorant Garamond",serif;
    background:radial-gradient(circle at 50% 18%, var(--bg1) 0%, var(--bg2) 100%);
    color:var(--rose-deep);
    min-height:100dvh;
    overflow-x:hidden;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:24px 18px calc(24px + env(safe-area-inset-bottom));
    position:relative;
  }

  /* floating butterflies + petals */
  .deco{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0}
  .fly{position:absolute;font-size:26px;opacity:.9;animation:float 9s ease-in-out infinite}
  @keyframes float{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-22px) rotate(8deg)}}

  .card{position:relative;z-index:2;width:100%;max-width:440px;text-align:center}

  /* ---- Header ---- */
  .name{
    font-family:"Playfair Display",serif;
    font-weight:700;
    color:var(--gold);
    font-size:clamp(54px,16vw,76px);
    line-height:.95;
    letter-spacing:.5px;
    text-shadow:0 2px 0 rgba(255,255,255,.5);
  }
  .surname{
    font-family:"Great Vibes",cursive;
    color:var(--rose);
    font-size:clamp(34px,10vw,48px);
    margin-top:-4px;
    line-height:1.1;
  }
  .subtitle{
    font-family:"Cormorant Garamond",serif;
    font-weight:600;
    letter-spacing:.32em;
    text-transform:uppercase;
    color:var(--gold);
    font-size:clamp(13px,3.6vw,16px);
    margin-top:12px;
  }

  /* ---- Envelope ---- */
  .stage{
    position:relative;
    margin:30px auto 0;
    width:min(86vw,360px);
    aspect-ratio:7/5;
    cursor:pointer;
    perspective:1200px;
  }
  .envelope{position:absolute;inset:0}
  .env-body{
    position:absolute;inset:0;
    border-radius:16px;
    background:linear-gradient(160deg,var(--env1),var(--env2));
    box-shadow:0 22px 45px rgba(216,79,140,.28), inset 0 0 0 2px rgba(255,255,255,.25);
    overflow:hidden;
  }
  /* diagonal side folds */
  .env-body::before,.env-body::after{
    content:"";position:absolute;top:0;width:52%;height:100%;
    background:linear-gradient(135deg,rgba(255,255,255,.12),rgba(217,79,140,.14));
  }
  .env-body::before{left:0;clip-path:polygon(0 0,0 100%,100% 50%)}
  .env-body::after{right:0;clip-path:polygon(100% 0,100% 100%,0 50%)}

  /* the letter that rises out */
  .letter{
    position:absolute;left:6%;right:6%;bottom:6%;
    height:78%;
    background:linear-gradient(180deg,var(--cream),#ffeef6);
    border-radius:12px;
    box-shadow:0 10px 26px rgba(216,79,140,.25);
    z-index:2;
    transform:translateY(0);
    transition:transform 1s cubic-bezier(.22,1,.36,1) .25s;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
    padding:14px;
  }
  .letter img{max-width:70%;max-height:88%;object-fit:contain;filter:drop-shadow(0 6px 10px rgba(0,0,0,.15))}

  /* flap */
  .flap{
    position:absolute;top:0;left:0;width:100%;height:58%;
    background:linear-gradient(160deg,var(--env-flap),#ec8db0);
    clip-path:polygon(0 0,100% 0,50% 100%);
    transform-origin:top center;
    transition:transform .8s cubic-bezier(.6,-0.2,.3,1);
    z-index:4;
    box-shadow:0 3px 6px rgba(216,79,140,.18);
    backface-visibility:hidden;
  }
  .env-front{
    position:absolute;bottom:0;left:0;width:100%;height:100%;
    background:linear-gradient(160deg,var(--env1),var(--env2));
    clip-path:polygon(0 42%,50% 100%,100% 42%,100% 100%,0 100%);
    z-index:5;border-radius:0 0 16px 16px;
    box-shadow:inset 0 0 0 2px rgba(255,255,255,.22);
  }

  /* flower seal */
  .seal{
    position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
    z-index:6;width:64px;height:64px;
    display:flex;align-items:center;justify-content:center;
    transition:opacity .4s, transform .4s;
  }
  .seal svg{width:100%;height:100%;filter:drop-shadow(0 3px 5px rgba(216,79,140,.4))}
  .seal-text{
    position:absolute;left:50%;top:56%;transform:translate(-50%,-50%);
    z-index:6;width:150px;height:150px;pointer-events:none;
    animation:spin 18s linear infinite;transition:opacity .4s;
  }
  @keyframes spin{to{transform:translate(-50%,-50%) rotate(360deg)}}
  .seal-text text{fill:#fff;font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:3px;font-weight:600}

  .tap-hint{
    margin-top:22px;color:var(--rose);font-size:17px;font-weight:600;
    letter-spacing:.04em;opacity:.95;
    animation:pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse{0%,100%{opacity:.55;transform:translateY(0)}50%{opacity:1;transform:translateY(-3px)}}

  /* ---- OPEN state ---- */
  .stage.open{cursor:default}
  .stage.open .flap{transform:rotateX(-172deg);z-index:1}
  .stage.open .seal,.stage.open .seal-text{opacity:0;pointer-events:none}
  .stage.open .letter{transform:translateY(-16%)}
  .stage.open ~ .tap-hint{opacity:0;pointer-events:none;height:0;margin:0}

  /* ---- Video modal ---- */
  .modal{
    position:fixed;inset:0;z-index:30;
    background:rgba(120,30,70,.55);backdrop-filter:blur(6px);
    display:flex;align-items:center;justify-content:center;
    padding:20px;opacity:0;pointer-events:none;transition:opacity .45s;
  }
  .modal.show{opacity:1;pointer-events:auto}
  .frame{
    position:relative;width:100%;max-width:430px;
    background:linear-gradient(180deg,#fff,#ffeef6);
    border-radius:22px;padding:14px 14px 18px;
    box-shadow:0 30px 70px rgba(120,30,70,.5);
    transform:scale(.88) translateY(14px);transition:transform .5s cubic-bezier(.22,1,.36,1);
  }
  .modal.show .frame{transform:scale(1) translateY(0)}
  .frame h3{
    font-family:"Great Vibes",cursive;color:var(--rose);
    font-size:30px;text-align:center;margin:2px 0 10px;font-weight:400;
  }
  video{width:100%;border-radius:14px;display:block;background:#000}
  .close{
    position:absolute;top:-14px;right:-14px;width:40px;height:40px;border:none;
    border-radius:50%;background:var(--rose);color:#fff;font-size:22px;cursor:pointer;
    box-shadow:0 6px 16px rgba(216,79,140,.5);line-height:1;
  }
  .replay{
    display:block;margin:12px auto 0;border:none;background:var(--gold);color:#fff;
    font-family:"Cormorant Garamond",serif;font-weight:600;font-size:15px;letter-spacing:.1em;
    padding:9px 22px;border-radius:30px;cursor:pointer;text-transform:uppercase;
  }

  /* bottom flowers */
  .garden{position:fixed;bottom:0;left:0;width:100%;z-index:1;pointer-events:none;line-height:0}
  .garden svg{width:100%;height:auto;display:block}

  @media(min-width:500px){.name{font-size:84px}}
</style>
</head>
<body>

<div class="deco" id="deco"></div>

<div class="card">
  <div class="name">Emilia</div>
  <div class="surname">Vázquez Montiel</div>
  <div class="subtitle">Mi Fiesta de 3 Años</div>

  <div class="stage" id="stage" role="button" aria-label="Abrir invitación">
    <div class="envelope">
      <div class="env-body">
        <div class="letter"><img src="assets/minnie.png" alt="Minnie" /></div>
      </div>
      <div class="flap"></div>
      <div class="env-front"></div>
      <div class="seal">
        <svg viewBox="0 0 64 64" aria-hidden="true">
          <g fill="#e07bab">
            <circle cx="32" cy="14" r="11"/><circle cx="32" cy="50" r="11"/>
            <circle cx="14" cy="32" r="11"/><circle cx="50" cy="32" r="11"/>
          </g>
          <circle cx="32" cy="32" r="13" fill="#ef9bbb"/>
          <circle cx="27" cy="29" r="2.1" fill="#d94f8c"/>
          <circle cx="37" cy="29" r="2.1" fill="#d94f8c"/>
          <circle cx="27" cy="36" r="2.1" fill="#d94f8c"/>
          <circle cx="37" cy="36" r="2.1" fill="#d94f8c"/>
        </svg>
      </div>
      <svg class="seal-text" viewBox="0 0 150 150" aria-hidden="true">
        <defs><path id="circlePath" d="M75,75 m-56,0 a56,56 0 1,1 112,0 a56,56 0 1,1 -112,0"/></defs>
        <text><textPath href="#circlePath" startOffset="0%">· TOCA AQUÍ PARA ABRIR · TOCA AQUÍ PARA ABRIR </textPath></text>
      </svg>
    </div>
  </div>

  <div class="tap-hint" id="hint">💌 Toca el sobre para abrir</div>
</div>

<!-- Video modal -->
<div class="modal" id="modal">
  <div class="frame">
    <button class="close" id="close" aria-label="Cerrar">×</button>
    <h3>Con mucho cariño 💕</h3>
    <video id="vid" controls playsinline preload="metadata" poster="assets/preview.png">
      <source src="assets/video.mp4" type="video/mp4" />
    </video>
    <button class="replay" id="replay">Ver de nuevo ↺</button>
  </div>
</div>

<!-- bottom garden -->
<div class="garden" aria-hidden="true">
  <svg viewBox="0 0 400 70" preserveAspectRatio="none">
    <g>
      <ellipse cx="40" cy="60" rx="9" ry="22" fill="#a7d08a"/>
      <ellipse cx="120" cy="60" rx="8" ry="18" fill="#bfe0a3"/>
      <ellipse cx="210" cy="60" rx="9" ry="22" fill="#a7d08a"/>
      <ellipse cx="300" cy="60" rx="8" ry="18" fill="#bfe0a3"/>
      <ellipse cx="370" cy="60" rx="9" ry="22" fill="#a7d08a"/>
    </g>
    <g>
      <g transform="translate(40,55)"><circle r="12" fill="#f4a9c4"/><circle r="5" fill="#f2cf5a"/></g>
      <g transform="translate(130,58)"><circle r="10" fill="#f7c0d6"/><circle r="4" fill="#e98fb4"/></g>
      <g transform="translate(205,55)"><circle r="13" fill="#ef9bbb"/><circle r="5" fill="#f2cf5a"/></g>
      <g transform="translate(290,58)"><circle r="10" fill="#f7c0d6"/><circle r="4" fill="#e98fb4"/></g>
      <g transform="translate(365,55)"><circle r="12" fill="#f4a9c4"/><circle r="5" fill="#f2cf5a"/></g>
    </g>
  </svg>
</div>

<script>
  // scatter butterflies & hearts
  const deco=document.getElementById('deco');
  const emojis=['🦋','🌸','🎀','💗','🦋','🌼','🎀'];
  for(let i=0;i<9;i++){
    const s=document.createElement('div');
    s.className='fly';
    s.textContent=emojis[i%emojis.length];
    s.style.left=(Math.random()*92+2)+'%';
    s.style.top=(Math.random()*78+4)+'%';
    s.style.animationDelay=(Math.random()*6)+'s';
    s.style.fontSize=(18+Math.random()*16)+'px';
    deco.appendChild(s);
  }

  const stage=document.getElementById('stage');
  const modal=document.getElementById('modal');
  const vid=document.getElementById('vid');
  let opened=false;

  function openInvite(){
    if(opened) {openModal();return;}
    opened=true;
    stage.classList.add('open');
    document.getElementById('hint').style.opacity='0';
    burst();
    setTimeout(openModal,1150);
  }
  function openModal(){
    modal.classList.add('show');
    vid.currentTime=0;
    const p=vid.play(); if(p&&p.catch)p.catch(()=>{});
  }
  function closeModal(){
    modal.classList.remove('show');
    vid.pause();
  }

  stage.addEventListener('click',openInvite);
  document.getElementById('close').addEventListener('click',closeModal);
  document.getElementById('replay').addEventListener('click',()=>{vid.currentTime=0;vid.play();});
  modal.addEventListener('click',e=>{if(e.target===modal)closeModal();});

  // confetti burst on open
  function burst(){
    const colors=['#ec6fa6','#f2cf5a','#a7d08a','#d94f8c','#fff','#f7c0d6'];
    for(let i=0;i<40;i++){
      const c=document.createElement('div');
      c.style.cssText=`position:fixed;z-index:25;width:10px;height:14px;border-radius:2px;
        left:50%;top:48%;pointer-events:none;
        background:${colors[i%colors.length]};`;
      document.body.appendChild(c);
      const ang=Math.random()*Math.PI*2, dist=120+Math.random()*220;
      const x=Math.cos(ang)*dist, y=Math.sin(ang)*dist-60;
      c.animate([
        {transform:'translate(-50%,-50%) rotate(0deg)',opacity:1},
        {transform:`translate(${x}px,${y}px) rotate(${Math.random()*720}deg)`,opacity:0}
      ],{duration:1100+Math.random()*700,easing:'cubic-bezier(.2,.7,.3,1)'}).onfinish=()=>c.remove();
    }
  }
</script>
</body>
</html>
